<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bodhi Sambad Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        /* Ensures the reader fits perfectly on mobile */
        #reader { width: 100%; }
        #reader video { width: 100%; border-radius: 8px; }
    </style>
</head>
<body class="bg-gray-100 flex flex-col items-center p-4">

    <div class="w-full max-w-sm mb-6 text-center">
        <h1 class="text-2xl font-bold text-red-900">BODHI SAMBAD 2026</h1>
        <p class="text-sm text-gray-600">Event Check-in Portal</p>
    </div>

    <div id="reader" class="w-full max-w-sm rounded-lg overflow-hidden border-2 border-red-900 shadow-lg bg-white"></div>
    
    <div id="result" class="mt-6 w-full max-w-sm p-5 bg-white rounded-xl shadow-md text-center hidden border border-gray-200">
        </div>

    <script src="app.js"></script>
</body>
</html>
