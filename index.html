<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bodhi Sambad Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-50 flex flex-col items-center p-2">

    <div class="w-full max-w-sm mb-4 text-center">
        <h1 class="text-2xl font-bold text-red-900">BODHI SAMBAD 2026</h1>
    </div>

    <div class="grid grid-cols-2 gap-2 w-full max-w-sm mb-4">
        <div class="bg-white p-3 rounded-lg shadow-sm border text-center">
            <p class="text-[10px] text-gray-500 uppercase">Total</p>
            <p id="total-count" class="text-lg font-bold">--</p>
        </div>
        <div class="bg-white p-3 rounded-lg shadow-sm border text-center">
            <p class="text-[10px] text-red-900 uppercase">Attending</p>
            <p id="attend-count" class="text-lg font-bold text-red-900">--</p>
        </div>
    </div>

    <div id="reader" class="w-full max-w-sm rounded-lg overflow-hidden border shadow-md"></div>
    
    <div id="result" class="mt-4 w-full max-w-sm p-4 bg-white rounded-lg shadow-sm text-center hidden"></div>

    <script src="app.js"></script>
</body>
</html>
